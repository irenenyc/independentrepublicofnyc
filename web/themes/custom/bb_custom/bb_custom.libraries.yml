global-styling:
  version: VERSION
  js:
    js/global.js: {}
  css:
    component:
      css/style.css: {}
      css/colors.css: {}

bootstrap:
  js:
    /libraries/popperjs/dist/umd/popper.min.js: { weight: -19 }
    /libraries/bootstrap/dist/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/dist/css/bootstrap.min.css: {}
  dependencies:
    - core/popperjs

bootstrap_cdn:
  js:
    //cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js: {}
  css:
    component:
      //cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css: {}
  dependencies:
    - core/popperjs

color.preview:
  version: VERSION
  css:
    theme:
      color/preview.css: {}
  js:
    color/preview.js: {}
  dependencies:
    - color/drupal.color

force-test:
  version: 1.x
  css:
    theme:
      css/force-test.css: {}

audio_snippets:
  version: 1.x
  js:
    js/audio-snippets.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/once

audio_timestamp:
  version: 1.x
  js:
    js/audio-timestamp.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupalSettings
    - core/once

map-zoom:
  js:
    js/map-zoom.js: {}
  dependencies:
    - core/jquery
    - core/drupal
